<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KalaCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Mukta is the Devanagari-capable fallback required by PRD 7.4, loaded now so
      a later language switch does not break type. Fraunces (display) and Hanken
      Grotesk (body) are PRD 9.4 and land with the Increment 5 design pass.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint, so a dark-theme session does
      // not flash the light canvas on load. Key must match THEME_STORAGE_KEY in
      // src/app/theme.ts.
      try {
        var stored = sessionStorage.getItem('kalacart-theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch (e) {
        // Storage blocked; the default light theme in the markup stands.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
