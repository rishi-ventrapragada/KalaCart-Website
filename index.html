<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      Two icons, in this order deliberately. Browsers that understand SVG take
      the first and scale it cleanly; the .ico is the fallback for those that do
      not, and it also answers the bare /favicon.ico that browsers request by
      convention whether or not it is declared here.

      That convention request is why the .ico has to exist at all: the SPA
      rewrite in vercel.json sends anything unmatched to index.html, so without
      a real file the browser got an HTML page where it expected an icon, and
      fell back to whatever it had cached before.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KalaCart</title>
    <meta
      name="description"
      content="Buy handmade goods straight from Indian artisans. No middlemen, no commission, and the full story of every craft."
    />
    <!--
      Theme colour for mobile browser chrome. ONE value, not one per
      prefers-color-scheme, because this app does not follow the OS preference:
      PRD 9.1 sets the default theme to light, ThemeProvider reads only its
      stored session value, and the pre-paint script below applies light unless
      a previous choice in this tab says otherwise.

      The earlier pair keyed on prefers-color-scheme contradicted that. A reader
      whose OS is dark and who had made no choice got a #121212 address bar
      above a parchment page - the one combination neither theme ever paints.

      The value is the literal --canvas of the light palette (src/app/theme.ts);
      the tag is read before any stylesheet resolves, so a var() would not work.
      A reader who switches to dark keeps a light chrome bar until reload, which
      is the lesser of the two mismatches and the honest default for a page that
      loads light. Making it track the toggle means writing this tag from
      ThemeProvider, which is a change worth making only if it is asked for.
    -->
    <meta name="theme-color" content="#F6E9DF" />
    <!--
      Link unfurls. %ORIGIN% is substituted at build time by the plugin in
      vite.config.ts: the deployment's own production origin on Vercel, and an
      empty string locally (leaving the relative path that localhost wants).

      og:image has to be absolute in production. Most scrapers resolve a
      relative path against the page URL, but several do not - WhatsApp among
      them, which is the channel this project's own buyers and artisans use to
      share a listing - and they show no preview at all rather than a broken
      one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KalaCart" />
    <meta
      property="og:description"
      content="Buy handmade goods straight from Indian artisans. No middlemen, no commission, and the full story of every craft."
    />
    <meta property="og:image" content="%ORIGIN%/og-image.svg" />
    <meta property="og:url" content="%ORIGIN%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fraunces for display and Hanken Grotesk for body (PRD 9.4), with Mukta
      behind them as the Devanagari-capable fallback (PRD 7.4) so a later
      language switch does not break type.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600&family=Mukta:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint, so a dark-theme session does
      // not flash the light canvas on load. Key must match THEME_STORAGE_KEY in
      // src/app/theme.ts.
      try {
        var stored = sessionStorage.getItem('kalacart-theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch (e) {
        // Storage blocked; the default light theme in the markup stands.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
