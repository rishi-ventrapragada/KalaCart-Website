<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!--
    Home-screen icon. Unlike the favicon this DOES carry a plate: iOS composites
    the icon onto the user's wallpaper, so a transparent ground would leave the
    glyph floating on whatever photo is behind it. The plate is the light
    theme's canvas (#F6E9DF) with the mark at #1A1512 - a fixed pairing, since
    an installed icon cannot follow the site's theme toggle.

    iOS applies its own rounded-rect mask, so the artwork stays square and the
    glyph is inset well clear of the corners it will crop.
  -->
  <rect width="180" height="180" fill="#F6E9DF"/>
  <g fill="none" stroke="#1A1512" stroke-width="3.6" stroke-linecap="round" transform="translate(24 24) scale(4.125)">
    <path d="M11 6 L11 26"/>
    <path d="M21 6 L21 26"/>
    <path d="M5 11 L16.4 11"/>
    <path d="M25.6 11 L27 11"/>
    <path d="M5 21 L6.4 21"/>
    <path d="M15.6 21 L27 21"/>
  </g>
</svg>
