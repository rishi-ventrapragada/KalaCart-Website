<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The KalaCart mark. Inked at #1A1512 rather than a theme token: a favicon is
    painted by the browser chrome, which no stylesheet of ours reaches, so there
    is no `currentColor` to inherit and this is the one place the literal
    artwork colour is correct. The in-app mark is
    src/components/brand/BrandMark.tsx, which does inherit `ink`.

    No background plate. Browser tab strips are light or dark by the OS theme,
    and a near-black glyph on a transparent ground is legible on light chrome
    while dark chrome lifts it - a baked-in parchment plate would instead sit as
    a bright rectangle in a dark tab strip.
  -->
  <g fill="none" stroke="#1A1512" stroke-width="3.6" stroke-linecap="round">
    <path d="M11 6 L11 26"/>
    <path d="M21 6 L21 26"/>
    <path d="M5 11 L16.4 11"/>
    <path d="M25.6 11 L27 11"/>
    <path d="M5 21 L6.4 21"/>
    <path d="M15.6 21 L27 21"/>
  </g>
</svg>
